<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 560px;
            margin: 40px auto;
            padding: 0 16px;
        }

        label {
            display: block;
            margin-top: 16px;
            font-weight: 600;
        }

        input, textarea, button {
            width: 100%;
            box-sizing: border-box;
            margin-top: 6px;
            padding: 10px;
            font: inherit;
        }

        button {
            margin-top: 18px;
            cursor: pointer;
        }

        pre {
            white-space: pre-wrap;
            background: #f4f4f4;
            padding: 12px;
            margin-top: 18px;
        }
    </style>
</head>
<body>
    <h1>Razorpay Payment Test</h1>

    <label for="baseUrl">Backend URL</label>
    <input id="baseUrl" value="http://localhost:5000" />

    <label for="token">Customer Bearer Token</label>
    <textarea id="token" rows="4" placeholder="Paste customer access token only, without Bearer"></textarea>

    <label for="orderId">Order ID</label>
    <input id="orderId" placeholder="MongoDB order id" />

    <button id="payButton">Pay Now</button>

    <pre id="output">Ready.</pre>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="./app.js"></script>
</body>
</html>
